# Parcours de référence : login admin puis lectures authentifiées.
# Ajouter ici les endpoints métier à mesurer (nommer chaque requête via `name`).
scenarios:
  - name: admin_browse
    flow:
      - post:
          url: /auth/admin/login
          name: auth_admin_login
          json:
            email: "{{ adminEmail }}"
            password: "{{ adminPassword }}"
          capture:
            - json: $.data.access_token
              as: accessToken
              strict: true
          expect:
            - statusCode: 200
            - hasProperty: data.access_token
      - get:
          url: /profile/me
          name: profile_me
          beforeRequest: withAuth
          expect:
            - statusCode: 200
      - get:
          url: /notifications?page=1&per_page=10
          name: notifications_list
          beforeRequest: withAuth
          expect:
            - statusCode: [200, 206]
      - get:
          url: /annonces?page=1&per_page=10
          name: annonces_list
          expect:
            - statusCode: [200, 206]
      - get:
          url: /admin/examples?page=1&per_page=10
          name: examples_list
          beforeRequest: withAuth
          expect:
            - statusCode: [200, 206]
